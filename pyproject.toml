[project]
name = "motionage"
version = "0.1.0"
description = "Public companion code for MotionAge wearable activity and mortality-risk analyses."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Jackie Jiaqi Yin" },
]
dependencies = [
    "joblib>=1.3",
    "lifelines>=0.27",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "optuna>=3.6",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "seaborn>=0.13",
    "torch>=2.0",
    "tqdm>=4.66",
]

[project.scripts]
motionage-validate-paper-models = "motionage.cli:validate_paper_models_main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motionage"]

[tool.uv]
managed = true
package = true
