experiment:
  name: gru_fitbit_only_60m
  output_dir: experiments/paper/gru_fitbit_only_60m
  init_checkpoint: null
  init_strict: false
task:
  type: binary_classification
  selection_metric: auprc
  threshold_metric: balanced_accuracy
labeling:
  followup_month_column: permth_int
  followup_months: 60
  target_definition: I(mortstat = 1 and permth_int <= 60)
data:
  parquet_path: data/processed/activity_mortstat/activity_mortstat_joined.parquet
  target_source: parquet
  feature_columns: [intensity_mean, PAXHOUR, PAXDAY, attention_flag]
  target_column: mortstat
  id_column: SEQN
  normalize_intensity: true
split:
  mode: precomputed
  precomputed_dir: data/processed/splits/mortstat_60m_seed42
  test_size: 0.2
  val_size: 0.25
  random_seed: 42
windowing:
  seq_len: 1008
  stride_ratio: 1.0
  target_mode: participant
  min_attention_ratio: 0.3
model:
  type: gru_binary
  hidden_size: 64
  num_layers: 2
  dropout: 0.117
  hour_emb_dim: 8
  day_emb_dim: 2
training:
  max_epochs: 80
  batch_size: 128
  eval_batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0003
  early_stopping_patience: 10
  grad_clip_norm: 1.0
device: cpu
